app:
  timezone: Asia/Ho_Chi_Minh
  http:
    address: :8080

database:
  url: "${DATABASE_URL}"
  # Delete notification_jobs not updated within this duration. Set 0s to disable.
  notification_jobs_retention: 720h

market:
  default_provider: binance
  symbols:
    - BTC
    - ETH
    - SOL
  intervals:
    - 1h
    - 4h
  providers:
    binance:
      enabled: true
      base_url: https://api.binance.com
      symbols:
        BTC: { symbol: BTCUSDT }
        ETH: { symbol: ETHUSDT }
        SOL: { symbol: SOLUSDT }
    coinmarketcap:
      enabled: false
      base_url: https://pro-api.coinmarketcap.com
      unit: usd
      symbols: {}

schedule:
  active_from: "06:00"
  active_until: "23:00"
  tick_interval: "1m"

notifications:
  # When true, messages are logged instead of sent to Telegram or Slack.
  dry: false
  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
  slack:
    enabled: false
    webhook_url: "${SLACK_WEBHOOK_URL}"

chat:
  enabled: false
  max_symbols_per_target: 20
  max_targets: 100
  webhook_base_url: "${WEBHOOK_URL}"
  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    webhook_secret: "${TELEGRAM_WEBHOOK_SECRET}"
    # Set true for local development to skip Telegram setWebhook during startup.
    skip_webhook_registration: false
  slack:
    enabled: false
    signing_secret: "${SLACK_SIGNING_SECRET}"
    bot_token: "${SLACK_BOT_TOKEN}"
    app_id: "${SLACK_APP_ID}"
    team_id: "${SLACK_TEAM_ID}"

retry:
  max_attempts: 3
  initial_backoff: 500ms

concurrency:
  market_requests: 5
