services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crypto_alert
      POSTGRES_USER: crypto_alert
      POSTGRES_PASSWORD: crypto_alert
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_alert -d crypto_alert"]
      interval: 5s
      timeout: 5s
      retries: 10

  crypto-alert:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONFIG_FILE: /app/configs/config.yaml
      DATABASE_URL: postgres://crypto_alert:crypto_alert@postgres:5432/crypto_alert?sslmode=disable
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "2345:2345" # delve debugger
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
